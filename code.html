<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CodeSmith - Mini Coding AI</title>
<link href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.css" rel="stylesheet"/>
<style>
  /* ===== Reset & Base ===== */
  * { margin:0; padding:0; box-sizing:border-box; font-family: 'Fira Code', monospace; }
  body {
    background: #121212;
    color: #eee;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px;
    min-height: 100vh;
  }

  h1 {
    font-size: 3rem;
    font-weight: 700;
    margin-bottom: 30px;
    background: linear-gradient(90deg, #42a5f5, #00acc1);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* ===== Container ===== */
  .container {
    background: #1e1e28;
    width: 700px;
    max-width: 95%;
    padding: 30px 40px;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    display: flex;
    flex-direction: column;
    gap: 20px;
    transition: all 0.3s ease;
  }

  textarea {
    width: 100%;
    height: 150px;
    background: #2a2a3a;
    border: none;
    border-radius: 10px;
    padding: 15px;
    color: #eee;
    font-size: 16px;
    resize: vertical;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.4);
    transition: box-shadow 0.3s ease, transform 0.2s ease;
  }
  textarea:focus {
    outline: none;
    box-shadow: inset 0 2px 8px rgba(0,188,212,0.7);
    transform: scale(1.02);
  }

  select, button {
    padding: 12px 20px;
    border-radius: 10px;
    border: none;
    font-size: 16px;
    transition: 0.3s;
  }

  select {
    background: #2a2a3a;
    color: #eee;
    box-shadow: inset 0 2px 5px rgba(0,0,0,0.4);
  }
  select:focus { outline: none; box-shadow: inset 0 2px 8px rgba(0,188,212,0.7); }

  button {
    background: #00acc1;
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 5px 15px rgba(0,188,212,0.4);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  button:hover {
    background: #42a5f5;
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0,188,212,0.6);
  }

  pre {
    background: #2a2a3a;
    padding: 20px;
    border-radius: 10px;
    max-height: 350px;
    overflow-x: auto;
    overflow-y: auto;
    font-size: 15px;
    position: relative;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
  }

  .thinking {
    display: inline-block;
    width: 12px;
    height: 12px;
    margin: 0 2px;
    background-color: #00acc1;
    border-radius: 50%;
    animation: blink 1s infinite alternate;
  }
  .thinking:nth-child(2) { animation-delay: 0.2s; }
  .thinking:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink {
    0% { transform: scale(1); opacity: 0.3; }
    50% { transform: scale(1.5); opacity: 1; }
    100% { transform: scale(1); opacity: 0.3; }
  }

  .copy-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    background: #00acc1;
    color: #fff;
    border: none;
    padding: 5px 12px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: 0.2s;
  }
  .copy-btn:hover {
    background: #42a5f5;
    color: #000;
  }

</style>
</head>
<body>

<h1>CodeSmith</h1>
<div class="container">
  <textarea id="prompt" placeholder="Describe your coding problem here..."></textarea>
  <select id="language">
    <option value="JavaScript">JavaScript</option>
    <option value="Python">Python</option>
    <option value="HTML/CSS">HTML/CSS</option>
  </select>
  <button onclick="askAI()">Ask AI</button>
  <pre id="output">
    <button class="copy-btn" onclick="copyCode()">Copy</button>
    Your AI-generated code will appear here...
  </pre>
</div>

<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.js"></script>
<script>
async function askAI() {
  const prompt = document.getElementById('prompt').value;
  const language = document.getElementById('language').value;
  const output = document.getElementById('output');

  if (!prompt) return alert("Type something first!");
  output.innerHTML = '<span class="thinking"></span><span class="thinking"></span><span class="thinking"></span> Thinking...';

  try {
    const response = await fetch("https://api.openai.com/v1/chat/completions", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer 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"
      },
      body: JSON.stringify({
        model: "gpt-5-mini",
        messages: [
          { role: "system", content: "You are CodeSmith, a coding AI. Generate working " + language + " code, clear and minimal." },
          { role: "user", content: prompt }
        ],
        max_tokens: 500
      })
    });
    const data = await response.json();
    const code = data.choices[0].message.content;
    output.innerHTML = '<button class="copy-btn" onclick="copyCode()">Copy</button><code class="language-'+language.toLowerCase()+'">'+code+'</code>';
    Prism.highlightAll();
  } catch(err) {
    output.textContent = "Error: " + err.message;
  }
}

function copyCode() {
  const codeEl = document.querySelector('#output code');
  if (!codeEl) return;
  navigator.clipboard.writeText(codeEl.innerText);
  alert("Code copied!");
}
</script>

</body>
</html>
